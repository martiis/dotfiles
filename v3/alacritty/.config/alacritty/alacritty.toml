general.import = ["theme/gruvbox-dark.toml"]


[env]
TERM = "xterm-256color"

[font]
normal = { family = "MesloLGS Nerd Font Mono", style = "Regular" }
bold = { family = "MesloLGS Nerd Font Mono", style = "Bold" }
italic = { family = "MesloLGS Nerd Font Mono", style = "Italic" }
bold_italic = { family = "MesloLGS Nerd Font Mono", style = "Bold Italic" }
size = 11

[window]
padding.x = 10
padding.y = 10
blur = true
opacity = 0.95

[bell]
animation = "EaseOutExpo"
duration = 100
command = { program = "paplay", args = ["/usr/share/sounds/freedesktop/stereo/bell.oga"] }
