# Selected preferences from GNOME 51; not a full dconf dump.
# Applying this replaces the custom-shortcut and enabled-extension lists.
[org/gnome/desktop/interface]
clock-format='24h'
clock-show-weekday=true
color-scheme='prefer-dark'
cursor-size=24
cursor-theme='default'
show-battery-percentage=true

[org/gnome/desktop/default-applications/terminal]
exec='alacritty'
exec-arg='-e'

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'

[org/gnome/desktop/wm/keybindings]
begin-move=@as []
begin-resize=@as []
close=['<Super>w']
maximize=@as []
maximize-horizontally=['<Super>h']
maximize-vertically=['<Super>v']
minimize=@as []
move-to-workspace-1=['<Shift><Super>1']
move-to-workspace-2=['<Shift><Super>2']
move-to-workspace-3=['<Shift><Super>3']
move-to-workspace-4=['<Shift><Super>4']
switch-applications=['<Alt>Tab']
switch-applications-backward=['<Shift><Alt>Tab']
switch-to-workspace-1=['<Super>1']
switch-to-workspace-2=['<Super>2']
switch-to-workspace-3=['<Super>3']
switch-to-workspace-4=['<Super>4']
switch-windows=@as []
switch-windows-backward=@as []
toggle-fullscreen=@as []
toggle-maximized=['<Super>f']
unmaximize=['<Super>backslash']

[org/gnome/mutter]
dynamic-workspaces=true
workspaces-only-on-primary=true

[org/gnome/mutter/keybindings]
toggle-tiled-left=['<Super>bracketleft']
toggle-tiled-right=['<Super>bracketright']

[org/gnome/desktop/input-sources]
sources=[('xkb', 'us'), ('xkb', 'lt')]
xkb-options=['terminate:ctrl_alt_bksp']

[org/gnome/desktop/peripherals/touchpad]
two-finger-scrolling-enabled=true

[org/gnome/settings-daemon/plugins/media-keys]
control-center=['<Shift><Super>period']
home=['<Shift><Super>e']
www=['<Shift><Super>b']
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Super>Return'
command='/usr/bin/alacritty'
name='Terminal'

[org/gnome/shell/keybindings]
switch-to-application-1=@as []
switch-to-application-2=@as []
switch-to-application-3=@as []
switch-to-application-4=@as []

[org/gnome/shell]
enabled-extensions=['focus-changer@heartmire', 'clipboard-history@alexsaveau.dev', 'appindicatorsupport@rgcjonas.gmail.com']
