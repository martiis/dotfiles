# Tmux-inspired Herdr setup.
# Press Ctrl-s, release, then the action key.

# Pre-set so first launch does not rewrite this linked file.
onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[theme.custom]
# Use the terminal's default background so Alacritty opacity shows through.
panel_bg = "reset"

[keys]
# Keep the tmux prefix.
prefix = "ctrl+s"

# Your tmux muscle-memory bindings.
split_horizontal = "prefix+minus" # tmux: split-window -v (split down)
split_vertical = ["prefix+h", "prefix+v"] # tmux: split-window -h (split right)
rename_tab = ["prefix+comma", "prefix+shift+t"]
reload_config = ["prefix+r", "prefix+shift+r"]
resize_mode = "prefix+shift+e"
workspace_picker = "prefix+o"
open_notification_target = ""

# Spaces mirror the tab layer with Shift added.
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+comma"
previous_workspace = "prefix+shift+p"
next_workspace = "prefix+shift+n"
switch_workspace = "prefix+shift+1..9"
close_tab = "prefix+ampersand"
close_workspace = "prefix+shift+x"

# With prefix+h used to split right, use tmux's normal arrow navigation.
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"

# Keep Alt exclusively for agent navigation.
previous_agent = "prefix+alt+left"
next_agent = "prefix+alt+right"
focus_agent = "prefix+alt+1..9"

# tmux: prefix+g opens lazygit in a popup.
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

[ui]
# Closer to tmux's internal split dividers.
pane_outer_borders = false
pane_gaps = false
show_agent_labels_on_pane_borders = false
status_indicators = "symbols"

[ui.toast]
delivery = "herdr"
